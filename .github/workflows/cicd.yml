name: CI/CD catálogo de libros

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pruebas:
    name: Pruebas automatizadas
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar pytest
        run: pytest -v

  despliegue:
    name: Despliegue continuo
    needs: pruebas
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Solicitar publicación en Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Render publica la rama main cuando este workflow queda en verde."
            echo "Ese comportamiento está en render.yaml: autoDeployTrigger checksPass."
            exit 0
          fi
          curl --fail-with-body -fsS "$RENDER_DEPLOY_HOOK_URL"
